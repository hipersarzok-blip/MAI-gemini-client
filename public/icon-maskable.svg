  <g fill="#FFFFFF">
    <!-- Letter M -->
    <path d="M 104 326 L 104 186 L 138 186 L 172 264 L 206 186 L 240 186 L 240 326 L 208 326 L 208 238 L 180 302 L 164 302 L 136 238 L 136 326 Z" />
    <!-- Letter A -->
