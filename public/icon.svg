  <!-- Bold Minimalist Geometric "MAI" Typography in Pure White -->
  <g fill="#FFFFFF">
    <!-- Letter M -->
    <path d="M 86 336 L 86 176 L 126 176 L 164 264 L 202 176 L 242 176 L 242 336 L 206 336 L 206 234 L 174 308 L 154 308 L 122 234 L 122 336 Z" />
    <!-- Letter A -->
    <path d="M 314 176 L 354 176 L 402 336 L 364 336 L 354 300 L 314 300 L 304 336 L 266 336 Z M 322 270 L 346 270 L 334 222 Z" />
    <!-- Letter I -->
